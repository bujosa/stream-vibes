name: Release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (for example 1.0.0 or 1.0.0-beta.1)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build universal macOS download
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version and source
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${REQUESTED_VERSION:-${GITHUB_REF#refs/tags/v}}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Version must be a semantic version"
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test security and domain behavior
        run: swift test

      - name: Install Tuist and generate project
        run: |
          brew install tuist
          make install
          make generate

      - name: Build Apple Silicon and Intel release
        run: |
          xcodebuild \
            -workspace StreamVibes.xcworkspace \
            -scheme StreamVibes-Workspace \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build_output \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 build

      - name: Package and verify download
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./scripts/package-release.sh "$RELEASE_VERSION" .build_output executables

      - name: Upload verified artifacts for release publication
        uses: actions/upload-artifact@v4
        with:
          name: StreamVibes-${{ steps.version.outputs.VERSION }}-macos-universal
          path: |
            executables/*.dmg
            executables/SHA256SUMS.txt
          if-no-files-found: error
